<g filter="url(#shadow)"><circle cx="29" cy="32" r="21" fill="none" stroke="url(#metal)" stroke-width="7"/><circle cx="29" cy="32" r="13" fill="none" stroke="#344252" stroke-width="2"/><path d="M29 32l22-22M43 10h8v8" fill="none" stroke="#168BDB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="29" cy="32" r="4" fill="url(#blue)"/></g>
