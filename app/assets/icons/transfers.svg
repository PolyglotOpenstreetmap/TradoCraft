<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none" role="img" aria-labelledby="title">
<title id="title">Transfers</title>

<defs>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F8FAFC"/>
    <stop offset=".32" stop-color="#AEB8C4"/>
    <stop offset=".62" stop-color="#E5E9EE"/>
    <stop offset="1" stop-color="#778391"/>
  </linearGradient>
  <linearGradient id="darkMetal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#697586"/>
    <stop offset=".5" stop-color="#303B49"/>
    <stop offset="1" stop-color="#1C2632"/>
  </linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#62C5FF"/>
    <stop offset=".45" stop-color="#168BDB"/>
    <stop offset="1" stop-color="#07549B"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#BDEBFF" stop-opacity=".9"/>
    <stop offset="1" stop-color="#17699F" stop-opacity=".55"/>
  </linearGradient>
  <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="1.2"/>
    <feOffset dy="1.2"/>
    <feComponentTransfer><feFuncA type="linear" slope=".22"/></feComponentTransfer>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<g filter="url(#shadow)"><path d="M7 40h50l-6 9H13z" fill="url(#darkMetal)" stroke="#263342" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="13" y="20" width="16" height="19" rx="2" fill="url(#metal)" stroke="#263342" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="33" y="13" width="16" height="26" rx="2" fill="url(#blue)" stroke="#263342" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 15v-7M41 8V4" stroke="#263342" stroke-width="2.5"/><path d="M9 55h46" stroke="#168BDB" stroke-width="3" stroke-linecap="round"/></g>
</svg>
